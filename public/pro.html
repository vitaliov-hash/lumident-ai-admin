<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LumiDent Pro</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/pro.css"></head>
<body><header class="topbar wrap"><a class="brand" href="/"><span class="brand-mark">✦</span><span>LumiDent<small>стоматология</small></span></a><span id="identity"></span><button id="logout" hidden>Выйти</button></header>
<main class="wrap pro-main"><h1>Ваш цифровой администратор</h1><p id="notice" role="status"></p>
<section id="auth" class="pro-card"><h2>Вход или регистрация</h2><form id="auth-form"><label>Электронная почта<input name="email" type="email" autocomplete="email" required></label><label>Пароль<input name="password" type="password" minlength="12" autocomplete="current-password" required></label><div class="actions"><button name="action" value="login">Войти</button><button name="action" value="register">Зарегистрироваться</button></div></form></section>
<section id="client" hidden><div class="pro-layout"><aside class="pro-card"><h2>Диалоги</h2><button id="new-chat">Новый разговор</button><div id="conversations"></div></aside><div class="pro-card chat-panel"><h2 id="chat-title">Разговор</h2><div id="pro-messages" class="chat-messages" role="log" aria-live="polite"></div><form id="pro-form" class="chat-form"><input id="pro-input" maxlength="2000" placeholder="Напишите ваш вопрос…" required><button type="submit" aria-label="Отправить">↗</button></form><small>Информация не заменяет очную консультацию врача. Онлайн-запись и отправка заявок сотруднику пока не подключены.</small></div></div></section>
<section id="admin" class="pro-card" hidden><h2>База знаний</h2><form id="knowledge-form"><label>Часы работы<input id="hours" maxlength="120" required></label><div id="admin-services"></div><button type="button" id="add-service">Добавить услугу</button> <button type="submit">Сохранить изменения</button></form></section>
<section id="public-services" class="pro-card"><h2>Услуги</h2><p id="public-hours"></p><div id="service-list" class="service-grid"></div></section>
</main><script src="/pro-app.js" defer></script></body></html>
